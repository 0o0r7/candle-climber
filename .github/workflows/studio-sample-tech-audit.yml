name: studio-sample-tech-audit

on:
  workflow_dispatch:
  push:
    branches: [research/studio-sample-catalog-v2]
    paths:
      - '.github/workflows/studio-sample-tech-audit.yml'
      - 'scripts/studio-sample-tech-audit.mjs'
      - 'analysis/studio-sample-catalog/catalog.json'

permissions:
  contents: write

concurrency:
  group: studio-sample-tech-audit
  cancel-in-progress: true

jobs:
  audit:
    if: github.ref_name == 'research/studio-sample-catalog-v2'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install pinned Playwright and Chromium
        run: |
          npm i --no-save --no-package-lock playwright@1.49.0
          npx playwright install --with-deps chromium

      - name: Capture public-page technical evidence
        run: node scripts/studio-sample-tech-audit.mjs
        env:
          CONCURRENCY: 2
          PAGE_TIMEOUT_MS: 30000
          GAME_BUDGET_MS: 60000
          SETTLE_MS: 1200
          BODY_TIMEOUT_MS: 1500
          DRAIN_TIMEOUT_MS: 3000

      - name: Commit latest checkpoint on the research branch
        if: always() && github.ref_name == 'research/studio-sample-catalog-v2'
        run: |
          git config user.name "studio-sample-audit-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for file in analysis/studio-sample-catalog/technical-audit.json analysis/studio-sample-catalog/technical-summary-fa.md; do
            if [ -f "$file" ]; then git add "$file"; fi
          done
          if git diff --cached --quiet; then
            echo "No checkpoint outputs to commit."
          else
            git commit -m "Update public sample-game audit checkpoint [skip ci]"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Upload screenshots and data as a backup artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: studio-sample-tech-audit
          path: analysis/studio-sample-catalog/
          if-no-files-found: warn
          retention-days: 30
