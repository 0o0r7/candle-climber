# E2E GAMER BOT — owner directive 2026-10-01
# A robot player boots the LIVE deployment (?renderer=v2), plays it (jump + RUSH),
# captures screenshots + console logs, and fails the run on any uncaught page error,
# non-whitelisted console error, or a static canvas. Free on GitHub Actions.
# NOTE: on push this may race the Vercel deploy (tests previous prod) — nightly cron
# always tests the settled production build.
name: e2e-gamer-bot

on:
  push:
    branches: [main]
  workflow_dispatch: {}
  schedule:
    - cron: "0 4 * * *" # nightly 04:00 UTC

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install deps
        run: bun install --frozen-lockfile

      - name: Install Chromium
        run: bunx playwright install --with-deps chromium

      - name: Play the game (prod smoke)
        run: bun scripts/e2e-gamer-bot.ts
        env:
          GAME_URL: https://candle-climber.vercel.app/play?renderer=v2
          RUN_SECONDS: "24"

      - name: Upload artifacts (screenshots + logs)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-artifacts
          path: e2e-artifacts/
          retention-days: 14

  # DEVICE MATRIX (Playwright, free GH runners) — 2026-11-03: replaces the
  # mobile coverage LambdaTest's plan refuses to automate (real-device leg
  # reports SKIP since 2026-10-19; the grid also ignores chromeOptions
  # mobileEmulation and does not forward CDP — all three probed 2026-11-03).
  # 8 profiles (desktop + 3 iPhone + 3 iPad + Pixel 7) walk the REAL player
  # path against settled PRODUCTION: wizard gate, mode tabs, dialogs,
  # mobile_rush_button (coarse-pointer UI), natural death card, Sentry, console.
  device-matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    # skip push runs: the matrix must test the SETTLED prod build (see the
    # push/Vercel-race note above); nightly cron + manual dispatch only.
    if: github.event_name != 'push'
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install deps
        run: bun install --frozen-lockfile

      - name: Install Chromium
        run: bunx playwright install --with-deps chromium

      - name: Run device matrix (prod, 8 profiles)
        run: bun scripts/realdevice_matrix.ts
        env:
          GAME_URL: https://candle-climber.vercel.app/play

      - name: Upload artifacts (screenshots + per-profile reports)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: device-matrix-artifacts
          path: qa/realdevice/
          retention-days: 14
