# Base44 sandbox dev environment for Candle Climber.
# Runs the Next.js app FROM THE CLONED SOURCE (bun dev server, hot reload) on host
# port 3000. Dependencies are installed at container start from bun.lock so edits
# to source/package.json never need an image rebuild.
services:
  web:
    image: oven/bun:1
    working_dir: /app
    # Non-interactive, lockfile-preserving install, then exec the dev server so it
    # owns PID 1 and receives signals. `bun run dev` = `next dev -p 3000`.
    command: ["sh", "-ec", "bun install --frozen-lockfile && exec bun run dev"]
    ports:
      - "3000:3000" # required public preview entry point
    volumes:
      - .:/app # live source: Next dev + HMR reflect edits immediately
    environment:
      - NODE_ENV=development
      - NEXT_TELEMETRY_DISABLED=1
      # Bind mounts often don't deliver inotify events into the container; force
      # polling so hot reload actually fires.
      - WATCHPACK_POLLING=true
      - CHOKIDAR_USEPOLLING=true
      # Passed through bare (platform-provided) — used by next.config.ts to allow
      # the preview proxy's origin/host for dev assets + HMR. Unset outside Base44.
      - BASE44_PREVIEW_MODE
      - BASE44_PUBLIC_HOST_SUFFIX
      - BASE44_SANDBOX_HOST_DOMAIN
    # Optional external credentials (e.g. DATABASE_URL for MongoDB Atlas leaderboard
    # persistence). Last entry so a dashboard value always wins over defaults.
    env_file:
      - /run/base44/app.env
    restart: on-failure
    healthcheck:
      # Probes real app responsiveness (the dev server answers HTTP), not just an open port.
      test:
        [
          "CMD-SHELL",
          "bun -e \"fetch('http://127.0.0.1:3000/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\"",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 240s
