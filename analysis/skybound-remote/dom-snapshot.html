    #loading::after { content: ""; position: fixed; inset: 0; z-index: -1; background: linear-gradient(0deg, #16213e 0%, #16213ee6 14%, #16213e99 30%, transparent 62%); pointer-events: none; }
    #loading > * { max-width: min(560px, 100%); justify-self: center; }
    #loading h1 { font-weight: 800; letter-spacing: 0.04em; color: #ffc93c; -webkit-text-stroke: 1px #16213e; font-size: clamp(24px, 4vw, 42px); line-height: 1.12; text-shadow: 0 2px 14px #16213e; }
    #loading-status { font-weight: 500; }
    #loading progress { display: block; width: min(320px, 75vw); height: 7px; border: 0; border-radius: 20px; overflow: hidden; accent-color: #ffc93c; background: #ffffff26; }
    #loading progress::-webkit-progress-bar { background: #ffffff26; border-radius: 20px; }
    #loading progress::-webkit-progress-value { background: #ffc93c; border-radius: 20px; }
    #loading progress::-moz-progress-bar { background: #ffc93c; border-radius: 20px; }
    #loading button { min-height: 44px; border: 1px solid #ffc93c; border-radius: 10px; background: #16213e; color: #f4f7ff; }
